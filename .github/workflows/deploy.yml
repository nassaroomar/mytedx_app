name: Deploy MyTEDx Lambdas

on:
  push:
    branches:
      - main 

jobs:
  deploy_lambdas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      - name: Deploy MyTEDx-SearchTalks
        run: |
          cd SearchTalks
          pip install pymongo -t .
          zip -r ../SearchTalks.zip .
          cd ..
          aws lambda update-function-code --function-name MyTEDx-SearchTalks --zip-file fileb://SearchTalks.zip

      - name: Deploy MyTEDx-GetVideoDetails
        run: |
          cd GetVideoDetails
          pip install pymongo -t .
          zip -r ../GetVideoDetails.zip .
          cd ..
          aws lambda update-function-code --function-name MyTEDx-GetVideoDetails --zip-file fileb://GetVideoDetails.zip

      - name: Deploy MyTEDx-GetFeed
        run: |
          cd GetFeed
          pip install pymongo -t .
          zip -r ../GetFeed.zip .
          cd ..
          aws lambda update-function-code --function-name MyTEDx-GetFeed --zip-file fileb://GetFeed.zip